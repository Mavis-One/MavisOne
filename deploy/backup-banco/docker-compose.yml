# Stack de BACKUP do banco do MavisONE — para subir no Portainer, na VPS.
#
# ANTES DE USAR ESTA STACK, VEJA SE VOCE PRECISA DELA
# ---------------------------------------------------
# O docker-compose.yml da raiz do repositorio ja sobe um servico `backup` junto
# com o banco: quem subiu o banco por ele NAO precisa desta stack, e manter as
# duas so faz dois backups do mesmo banco em dois lugares diferentes.
#
# Esta aqui existe para o caso contrario: um Postgres que NAO subiu por aquele
# compose — um banco que ja estava na VPS, ou em outra maquina.
#
# A DIFERENCA DE AGENDA ENTRE AS DUAS E DE PROPOSITO
#   La o gatilho e "nao existe copia das ultimas X horas, tire uma agora",
#   porque a maquina de desenvolvimento e desligada as 18h e um laco esperando
#   dar 03:00 nunca rodaria nela. Aqui, numa VPS ligada 24h, a hora fixa e
#   melhor: o backup cai sempre no horario mais vazio, e nao no horario em que
#   alguem reiniciou a stack. O laco abaixo tem as duas coisas — a hora marcada
#   e uma rede de seguranca para o dia em que a VPS estiver fora do ar as 03:00.
#
# O QUE MUDOU DESDE A SAIDA DO SUPABASE
# -------------------------------------
# Esta stack existia porque a maquina de desenvolvimento nao tinha pg_dump: o
# backup que rodava la exportava DADOS pelo PostgREST e nao trazia estrutura
# (funcao, gatilho, indice, sequencia). Havia duas camadas de backup, uma
# incompleta e uma completa.
#
# Agora sao a mesma coisa. Com o banco em Docker, `npm run backup` roda o
# pg_dump de dentro do container e ja traz estrutura e dados. Esta stack
# continua existindo por um motivo diferente e melhor: ela roda SOZINHA, todo
# dia, na VPS, sem ninguem lembrar de rodar nada.
#
# E OS ANEXOS DE PEDIDO?
# ----------------------
# Vem juntos. Antes o binario morava no Supabase Storage e ficava de fora do
# pg_dump — eram duas coisas para restaurar no mesmo ponto no tempo, e a
# segunda e a que se esquece. Desde a fase AM o anexo e a tabela `pedido_anexo`,
# entao o dump cobre os anexos tambem.
#
# O QUE O DUMP CONTINUA NAO COBRINDO
# ----------------------------------
# O razao de ESTOQUE (stockMovements, stockTransfers) e os lancamentos do
# Financeiro vivem no data/db.json do app — nao ha tabela deles no Postgres. O
# artefato desta stack passou a ser um .tar.gz e leva esse arquivo junto QUANDO
# consegue enxerga-lo (variavel ESTADO_ORIGEM). Rodando longe do app, que e o
# caso normal desta stack, o manifesto do artefato registra a ausencia — em vez
# de deixar a falta parecer arquivo corrompido na hora de restaurar.
#
# COMO SUBIR NO PORTAINER
#   Stacks -> Add stack -> cole este arquivo
#   Em "Environment variables", defina PGDUMP_URL e RETENCAO_DIAS.
#   NAO cole a senha no corpo do compose: ela ficaria salva no Portainer em
#   texto e apareceria para quem abrisse a stack.
#
# QUAL PGDUMP_URL USAR — a parte que mais derruba isto
#   O banco do MavisONE prende a porta em 127.0.0.1, entao "localhost" NAO
#   funciona de dentro deste container: cada container tem o proprio localhost.
#   As duas saidas que funcionam:
#
#   (a) rede compartilhada, que e a recomendada. A stack do banco cria uma rede
#       (por padrao "<nome-da-stack>_default"). Descubra o nome com
#       `docker network ls`, declare-a como external aqui embaixo, e use o NOME
#       DO SERVICO como host:
#         PGDUMP_URL=postgres://mavisone:SENHA@banco:5432/mavisone
#
#   (b) o IP do gateway do Docker (normalmente 172.17.0.1), que alcanca a porta
#       presa no host:
#         PGDUMP_URL=postgres://mavisone:SENHA@172.17.0.1:5432/mavisone
#
# A VERSAO DA IMAGEM IMPORTA
#   pg_dump precisa ser IGUAL OU MAIS NOVO que o servidor. Mais velho recusa com
#   "server version mismatch" e o backup nao sai — e o erro so aparece na
#   primeira execucao, de madrugada, sem ninguem olhando. O banco deste
#   repositorio e postgres:17, entao aqui e :17 tambem.
#
# O QUE ELE NAO FAZ
#   Nao manda o arquivo para fora da VPS. Se a VPS morrer, o backup morre junto.
#   Aponte o volume para um disco/rclone/S3 que saia da maquina, ou acrescente
#   um passo de envio. Backup na mesma maquina protege contra erro humano, nao
#   contra perda de maquina.

services:
  backup-banco:
    image: postgres:17-alpine
    container_name: backup-banco
    restart: unless-stopped
    environment:
      # Definida no Portainer, nao aqui. Ver o bloco sobre qual URL usar.
      PGDUMP_URL: ${PGDUMP_URL:?defina PGDUMP_URL nas variaveis da stack}
      RETENCAO_DIAS: ${RETENCAO_DIAS:-30}
      # Hora local do backup (formato 24h). Fuso definido em TZ.
      HORA: ${HORA:-03}
      # Rede de seguranca: passadas tantas horas sem NENHUM backup novo, tira um
      # fora de hora. E o que salva o dia em que a VPS estava reiniciando as
      # 03:00 — sem isto, aquele dia simplesmente nao tem copia, e ninguem fica
      # sabendo.
      LIMITE_HORAS: ${LIMITE_HORAS:-36}
      # A poda NUNCA desce abaixo disto. Sem esse piso, um banco fora do ar por
      # mais de RETENCAO_DIAS faria a limpeza apagar o ultimo backup que restou:
      # a falha vira perda total, e exatamente quando ninguem esta olhando.
      MINIMO_ARQUIVOS: ${MINIMO_ARQUIVOS:-3}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - backups:/backups
      # O ESTADO DO APP, SE ESTA MAQUINA TIVER UM.
      #
      # Parte do sistema nao mora no Postgres: o razao de estoque e os
      # lancamentos do Financeiro vivem no data/db.json do MavisONE. Esta stack
      # costuma rodar longe do app (e para isso que ela existe), e nesse caso o
      # artefato sai SO com o banco — e o manifesto diz isso, em vez de deixar a
      # ausencia parecer arquivo truncado na hora de restaurar.
      #
      # Se o app rodar NESTA maquina, aponte para a pasta data/ dele:
      #   ESTADO_ORIGEM=/caminho/do/clone/data
      # A PASTA, e nao o arquivo: bind mount para caminho inexistente faz o
      # Docker criar um DIRETORIO com aquele nome.
      - ${ESTADO_ORIGEM:-/dev/null}:/estado:ro
    # Laco proprio em vez de cron: a imagem do postgres nao traz cron, e
    # instalar um so para isto acrescenta uma peca que tambem pode falhar
    # calada. O laco dorme ate a hora marcada e roda uma vez por dia.
    # Laco proprio em vez de cron: a imagem do postgres nao traz cron, e
    # instalar um so para isto acrescenta uma peca que tambem pode falhar
    # calada. O laco acorda de 5 em 5 minutos e decide se e hora de copiar.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ESTADO=/estado/db.json
        MARCA_FIM='-- PostgreSQL database dump complete'

        # Os dois formatos: .tar.gz e o artefato novo, .sql.gz o antigo que
        # continua na pasta e continua valido. Se a busca enxergasse so um, a
        # rede de seguranca dispararia todo ciclo (nunca acha copia) ou a poda
        # pararia de podar.
        achar_backups() {
          find /backups \( -name 'mavisone-*.tar.gz' -o -name 'mavisone-*.sql.gz' \) "$$@" 2>/dev/null
        }

        echo "[backup] de pe. Alvo: $${HORA}:00 ($${TZ}), retencao $${RETENCAO_DIAS} dias (nunca menos que $${MINIMO_ARQUIVOS} arquivos)."
        echo "[backup] rede de seguranca: se passar de $${LIMITE_HORAS}h sem copia nova, tira uma fora de hora."
        if [ -f "$${ESTADO}" ]; then
          echo "[backup] o estado do app ($${ESTADO}) entra no arquivo junto com o banco."
        else
          echo "[backup] sem acesso ao estado do app: os arquivos sairao so com o Postgres."
          echo "[backup] (o estoque e o Financeiro do MavisONE moram no data/db.json — veja ESTADO_ORIGEM.)"
        fi

        # Montagens orfas de uma execucao interrompida.
        rm -rf /tmp/montagem.* 2>/dev/null || true
        rm -f /backups/*.parcial 2>/dev/null || true

        while true; do
          agora=$$(date +%H)
          atrasado=nao
          if [ -z "$$(achar_backups -mmin "-$$((LIMITE_HORAS * 60))" | head -n 1)" ]; then
            atrasado=sim
          fi

          if [ "$$agora" = "$${HORA}" ] || [ "$$atrasado" = "sim" ]; then
            if [ "$$atrasado" = "sim" ] && [ "$$agora" != "$${HORA}" ]; then
              echo "[backup] $$(date '+%F %T') sem copia ha mais de $${LIMITE_HORAS}h — tirando fora de hora."
            fi

            # Poda ANTES de gerar: o formato novo precisa do dump descomprimido
            # em disco antes de empacotar.
            total=$$(achar_backups | wc -l)
            for velho in $$(achar_backups -mtime "+$${RETENCAO_DIAS}" | sort); do
              if [ "$${total}" -le "$${MINIMO_ARQUIVOS}" ]; then break; fi
              rm -f "$${velho}"
              total=$$((total - 1))
              echo "[backup] podado (mais de $${RETENCAO_DIAS} dias): $${velho}"
            done

            carimbo=$$(date -u +%Y-%m-%dT%H-%M-%S)
            arquivo="/backups/mavisone-$${carimbo}.tar.gz"
            MONTAGEM=$$(mktemp -d /tmp/montagem.XXXXXX)
            echo "[backup] $$(date '+%F %T') gerando $$(basename "$${arquivo}")"
            falhou=""

            # O dump vai para um ARQUIVO, nao para um pipe: o status de um pipe e
            # o do ULTIMO comando, e com `pg_dump | gzip` um dump falho terminava
            # com sucesso e 20 bytes viravam backup bom.
            dump_iniciado=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if ! pg_dump "$${PGDUMP_URL}" --no-owner --no-privileges --clean --if-exists > "$${MONTAGEM}/banco.sql" 2>/tmp/erro-dump; then
              cat /tmp/erro-dump >&2
              falhou="pg_dump falhou"
            fi
            if [ -z "$${falhou}" ] && [ "$$(wc -c < "$${MONTAGEM}/banco.sql")" -lt 1024 ]; then
              falhou="o dump saiu com menos de 1 KB"
            fi
            # `-e` obrigatorio: o marcador comeca com "--" e o grep do busybox o
            # leria como lista de opcoes.
            if [ -z "$${falhou}" ] && ! tail -c 4096 "$${MONTAGEM}/banco.sql" | grep -q -e "$${MARCA_FIM}"; then
              falhou="o dump nao termina com a marca de conclusao — saiu truncado"
            fi

            membros="banco.sql"
            estado_ausente="esta stack nao enxerga o data/db.json do app (veja ESTADO_ORIGEM)"
            if [ -z "$${falhou}" ] && [ -f "$${ESTADO}" ]; then
              antes=$$(stat -c '%Y-%s' "$${ESTADO}")
              cp "$${ESTADO}" "$${MONTAGEM}/estado.json"
              depois=$$(stat -c '%Y-%s' "$${ESTADO}")
              if [ "$${antes}" != "$${depois}" ]; then
                falhou="o estado mudou durante a copia"
              elif [ "$$(head -c 1 "$${MONTAGEM}/estado.json")" != "{" ] || [ "$$(tail -c 1 "$${MONTAGEM}/estado.json")" != "}" ]; then
                falhou="o estado copiado nao e um objeto JSON completo"
              else
                membros="banco.sql estado.json"
                estado_ausente=""
              fi
            fi

            if [ -z "$${falhou}" ]; then
              {
                printf '{\n  "versaoFormato": 1,\n'
                printf '  "geradoPor": "deploy/backup-banco stack avulsa",\n'
                printf '  "geradoEm": "%s",\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                printf '  "dumpIniciadoEm": "%s",\n' "$${dump_iniciado}"
                if [ -n "$${estado_ausente}" ]; then
                  printf '  "estadoAusente": "%s",\n' "$${estado_ausente}"
                else
                  printf '  "estadoAusente": null,\n'
                fi
                printf '  "membros": [\n'
                primeiro=1
                for m in $${membros}; do
                  [ "$${primeiro}" = "1" ] || printf ',\n'
                  primeiro=0
                  printf '    { "nome": "%s", "bytes": %s, "sha256": "%s" }' \
                    "$${m}" "$$(wc -c < "$${MONTAGEM}/$${m}")" "$$(sha256sum "$${MONTAGEM}/$${m}" | cut -d' ' -f1)"
                done
                printf '\n  ]\n}\n'
              } > "$${MONTAGEM}/manifesto.json"

              if ! (cd "$${MONTAGEM}" && tar -czf artefato.tar.gz $${membros} manifesto.json); then
                falhou="o tar nao empacotou"
              fi
            fi

            # Ler de volta antes de promover: um tar.gz truncado passa em
            # qualquer teste de tamanho, e listar valida o CRC do gzip.
            if [ -z "$${falhou}" ] && ! tar -tzf "$${MONTAGEM}/artefato.tar.gz" > /dev/null 2>&1; then
              falhou="o arquivo gerado nao abre para leitura"
            fi

            if [ -z "$${falhou}" ]; then
              cp "$${MONTAGEM}/artefato.tar.gz" "$${arquivo}.parcial"
              mv "$${arquivo}.parcial" "$${arquivo}"
              echo "[backup] ok — $$(du -h "$${arquivo}" | cut -f1) ($${membros})"
            else
              rm -f "$${arquivo}.parcial"
              echo "[backup] FALHOU: $${falhou}. Nada foi gravado." >&2
            fi
            rm -rf "$${MONTAGEM}"

            # Dorme uma hora e um pouco para nao rodar duas vezes na mesma hora.
            sleep 3700
          fi
          sleep 300
        done
    healthcheck:
      # BACKUP QUE MORRE CALADO E O NORMAL, NAO A EXCECAO. Este teste nao
      # pergunta se o container esta vivo — um laco preso num erro continua
      # vivo. Ele pergunta se existe copia recente em disco. Passado o
      # LIMITE_HORAS mais uma folga, o container aparece "unhealthy" no
      # Portainer, que e onde alguem ve.
      test:
        - CMD-SHELL
        - >-
          find /backups \( -name 'mavisone-*.tar.gz' -o -name 'mavisone-*.sql.gz' \)
          -mmin "-$$(( ($${LIMITE_HORAS:-36} + 6) * 60 ))" | grep -q .
      interval: 15m
      timeout: 10s
      # Folga para a primeira copia sair antes de qualquer julgamento.
      start_period: 60m
      retries: 3
volumes:
  backups:
    # Trocar por um bind mount para um disco que saia da VPS:
    #   driver: local
    #   driver_opts: { type: none, o: bind, device: /mnt/backups }
    name: backup-banco

# Para o caminho (a) do bloco de PGDUMP_URL: descomente e ajuste o nome da rede
# que a stack do banco criou (veja com `docker network ls`).
# networks:
#   default:
#     name: mavisone_default
#     external: true
