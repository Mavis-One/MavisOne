# Stack de BACKUP do Supabase — para subir no Portainer, na VPS.
#
# POR QUE ESTA STACK EXISTE
# -------------------------
# A maquina de desenvolvimento nao tem pg_dump, nem psql, nem Docker: o backup
# que roda la (scripts/backup-supabase.js) exporta DADOS pelo PostgREST e nao
# traz estrutura — funcoes, gatilhos, indices, politicas. Aceitavel enquanto a
# estrutura viver nas migracoes versionadas, mas nao e um pg_dump.
#
# Na VPS ha Docker. Entao aqui da para rodar pg_dump de verdade, e esta stack e
# exatamente isso: um container que acorda, tira o dump completo, comprime,
# guarda e apaga os antigos.
#
# COMO SUBIR NO PORTAINER
#   Stacks -> Add stack -> cole este arquivo
#   Em "Environment variables", defina PGDUMP_URL (ver abaixo) e RETENCAO_DIAS.
#   NAO cole a senha no corpo do compose: ela ficaria salva no Portainer em
#   texto e apareceria para quem abrisse a stack.
#
# A VERSAO DA IMAGEM IMPORTA
#   pg_dump precisa ser IGUAL OU MAIS NOVO que o servidor. Mais velho recusa
#   com "server version mismatch" e o backup nao sai — e o erro so aparece na
#   primeira execucao.
#   Descubra a versao do seu Supabase (SQL Editor):   select version();
#   e ajuste a tag abaixo (postgres:15 / :16 / :17).
#
# QUAL CONEXAO USAR — a parte que mais derruba isto
#   Supabase oferece tres portas, e so duas servem:
#
#     db.<ref>.supabase.co:5432        conexao direta. Serve, MAS em muitos
#                                      projetos so responde em IPv6. Se a VPS
#                                      nao tiver IPv6, nao conecta.
#     ...pooler.supabase.com:5432      pooler em modo SESSAO. Serve, e responde
#                                      em IPv4. Costuma ser a escolha certa
#                                      numa VPS.
#     ...pooler.supabase.com:6543      pooler em modo TRANSACAO. **NAO SERVE**
#                                      para pg_dump: ele precisa de sessao, e o
#                                      dump falha no meio.
#
#   A string sai do painel: Project Settings -> Database -> Connection string.
#   Se der "no route to host" ou "network unreachable", e o caso do IPv6:
#   troque para o pooler em modo sessao.
#
# O QUE ELE NAO FAZ
#   Nao manda o arquivo para fora da VPS. Se a VPS morrer, o backup morre
#   junto. Aponte o volume para um disco/rclone/S3 que saia da maquina, ou
#   acrescente um passo de envio. Backup na mesma maquina protege contra erro
#   humano, nao contra perda de maquina.

services:
  backup-supabase:
    # Ajuste a major para bater com o servidor — ver o bloco acima.
    image: postgres:17-alpine
    container_name: backup-supabase
    restart: unless-stopped
    environment:
      # Definida no Portainer, nao aqui.
      PGDUMP_URL: ${PGDUMP_URL:?defina PGDUMP_URL nas variaveis da stack}
      RETENCAO_DIAS: ${RETENCAO_DIAS:-30}
      # Hora local do backup (formato 24h). Fuso definido em TZ.
      HORA: ${HORA:-03}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - backups:/backups
    # Laco proprio em vez de cron: a imagem do postgres nao traz cron, e
    # instalar um so para isto acrescenta uma peca que tambem pode falhar
    # calada. O laco dorme ate a hora marcada e roda uma vez por dia.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[backup] de pe. Alvo: $${HORA}:00 ($${TZ}), retencao $${RETENCAO_DIAS} dias."
        while true; do
          agora=$$(date +%H)
          if [ "$$agora" = "$${HORA}" ]; then
            carimbo=$$(date +%Y%m%d-%H%M%S)
            arquivo="/backups/supabase-$${carimbo}.sql.gz"
            echo "[backup] $$(date '+%F %T') gerando $${arquivo}"
            # --no-owner e --no-privileges: os papeis do Supabase nao existem
            # em outro servidor, e sem isto a restauracao falha em toda linha
            # de GRANT/OWNER TO.
            # --exclude-schema: schemas internos da plataforma, mantidos pelo
            # proprio Supabase; incluir so gera ruido e conflito ao restaurar.
            if pg_dump "$${PGDUMP_URL}" \
                 --no-owner --no-privileges \
                 --exclude-schema='extensions|graphql|graphql_public|net|pgbouncer|pgsodium|pgsodium_masks|realtime|supabase_functions|storage|vault|_realtime|_analytics|supabase_migrations' \
                 | gzip -9 > "$${arquivo}.parcial"; then
              # So vira arquivo final se o dump terminou. Sem isto, um dump
              # interrompido no meio fica com nome de backup bom e ninguem
              # descobre ate precisar dele.
              mv "$${arquivo}.parcial" "$${arquivo}"
              echo "[backup] ok — $$(du -h "$${arquivo}" | cut -f1)"
              find /backups -name 'supabase-*.sql.gz' -mtime "+$${RETENCAO_DIAS}" -print -delete
            else
              rm -f "$${arquivo}.parcial"
              echo "[backup] FALHOU — nada foi gravado. Veja o erro acima." >&2
            fi
            # Dorme uma hora e um pouco para nao rodar duas vezes na mesma hora.
            sleep 3700
          fi
          sleep 300
        done

volumes:
  backups:
    # Trocar por um bind mount para um disco que saia da VPS:
    #   driver: local
    #   driver_opts: { type: none, o: bind, device: /mnt/backups }
    name: backup-supabase
